version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    # Markdoc 0.5.8 narrowed Schema.children from string[] to NodeType[].
    # Keystatic 0.5.x still bundles Markdoc 0.4.0, so the Node returned by
    # post.content() is no longer assignable to transform() and both typecheck
    # and build fail in src/app/(site)/posts/[slug]/page.tsx. The dependency is
    # pinned exactly at 0.5.7 for that reason; lift this ignore only once
    # Keystatic ships a newer bundled Markdoc.
    ignore:
      - dependency-name: "@markdoc/markdoc"
        versions: [">=0.5.8"]
    groups:
      next:
        patterns:
          - next
          - "eslint-config-next"
          - "@next/*"
      keystatic:
        patterns:
          - "@keystatic/*"
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      tailwind:
        patterns:
          - tailwindcss
          - "@tailwindcss/*"
      test-tooling:
        patterns:
          - vitest
          - "@vitest/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
